name: 功能建议
description: 提出新功能或改进方向
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 示例数据均为虚构内容，不包含个人词库或隐私信息。
          required: true
